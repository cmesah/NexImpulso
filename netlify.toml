[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"

[[redirects]]
from = "/sobre-mi"
to = "/quienes-somos"
status = 301
force = true

[[redirects]]
from = "/como-trabajo"
to = "/como-trabajamos"
status = 301
force = true
